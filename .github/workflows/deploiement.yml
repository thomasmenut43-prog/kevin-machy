# Mise en ligne, à chaque fusion vers `main`.
#
# Le travail lui-même vit dans `mise-en-ligne.yml`, que les corrections de
# contenu appellent aussi. Ce fichier ne dit plus que **quand** déployer.

name: Déploiement

on:
  push:
    branches: [main]
  # Pour renvoyer la dernière version sans rien fusionner — après avoir changé
  # un secret, par exemple.
  workflow_dispatch:

# Un envoi à la fois, et on ne coupe jamais celui qui est en cours : un Worker
# interrompu en plein téléversement laisserait le site dans un état que
# personne n'a écrit.
#
# Le groupe est partagé avec les corrections de contenu, qui déploient elles
# aussi : deux constructions simultanées se marcheraient dessus.
concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  deployer:
    uses: ./.github/workflows/mise-en-ligne.yml
    # Le workflow appelé ne voit aucun secret de lui-même : il faut les lui
    # passer explicitement.
    secrets: inherit
