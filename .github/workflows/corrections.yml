# Corrections de contenu, à la demande.
#
# Certaines corrections ne vivent pas dans le code mais dans la base : le texte
# des pages, les ancres des sections. Les déployer ne suffit donc pas — il faut
# les appliquer.
#
# Or le mot de passe de la base n'existe en clair nulle part : il est posé en
# secret ici, en secret chez Hyperdrive, et Hostinger ne le réaffiche pas. Le
# réinitialiser pour lancer deux scripts coûterait une coupure de courrier, ce
# qui est arrivé une fois et suffit.
#
# Ce workflow emprunte donc le secret que le déploiement utilise déjà. Il ne se
# déclenche que sur un clic : **Actions → Corrections de contenu → Run
# workflow**.

name: Corrections de contenu

on:
  workflow_dispatch:
    inputs:
      appliquer:
        description: 'Appliquer les corrections (sinon, se contente de dire ce qui manque)'
        type: boolean
        default: false

# Partagé avec le déploiement : ce workflow en déclenche un, et deux
# constructions simultanées se marcheraient dessus.
concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  corriger:
    runs-on: ubuntu-latest

    env:
      # La base de Kevin. Le même secret que le déploiement, qui ne la lit que
      # pour construire — ici on y écrit, d'où le déclenchement manuel.
      DATABASE_URI: ${{ secrets.DATABASE_URI }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les pages de prestations désignent leurs images par leur nom
      # d'emplacement ; `poser-prestations.mjs` les traduit en identifiants de
      # médiathèque, et s'arrête net si l'un d'eux manque. Cette étape garantit
      # qu'ils sont là. Elle ne ré-encode rien : `public/img/` est versionné,
      # elle ne fait qu'inscrire ces fichiers dans la médiathèque.
      - name: La médiathèque connaît-elle toutes les images ?
        run: node scripts/importer-images.mjs

      # Toujours commencé par là, même quand on applique : le relevé d'avant
      # dit ce qui va changer, et reste dans le journal si quelque chose se
      # passe mal ensuite.
      - name: Ce qui manque, avant
        run: |
          npm run ancres -- --verifier || true
          npm run adresse -- --verifier || true
          npm run juridique -- --verifier || true
          npm run domaine -- --verifier || true
          npm run prestations -- --verifier || true

      # Les cinq scripts sont idempotents : relancés, ils ne refont rien.
      - name: Appliquer
        if: ${{ inputs.appliquer }}
        run: |
          npm run ancres
          npm run adresse
          npm run juridique
          npm run domaine
          npm run prestations

      - name: Ce qui reste, après
        if: ${{ inputs.appliquer }}
        run: |
          npm run ancres -- --verifier
          npm run adresse -- --verifier
          npm run juridique -- --verifier
          npm run domaine -- --verifier
          npm run prestations -- --verifier

  # Écrire en base ne suffit pas : les pages sont en cache, et ce cache ne
  # s'invalide que par le bouton « Publier » du BackOffice, qui pose les
  # étiquettes de rafraîchissement. Un script qui écrit directement contourne ce
  # mécanisme — les corrections sont en base, et le site sert toujours
  # l'ancienne version.
  #
  # Reconstruire règle la question : les pages sont figées à la construction,
  # avec le contenu du moment.
  #
  # Constaté le 2 octobre 2026 : les ancres et l'adresse étaient corrigées en
  # base depuis dix minutes, et le site n'en montrait rien.
  remettre-en-ligne:
    needs: corriger
    if: ${{ inputs.appliquer }}
    uses: ./.github/workflows/mise-en-ligne.yml
    secrets: inherit
