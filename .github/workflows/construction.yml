# Vérification de la construction à chaque poussée.
#
# Le BackOffice a besoin d'un serveur, d'une base et d'une authentification : la
# CI ne déploie rien, elle garantit seulement que la branche construit. L'envoi
# vers l'hébergeur sera rebranché quand son hébergement sera arrêté.

name: Construction

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: construction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest

    # Les écrans du BackOffice interrogent la base à la construction : il leur
    # faut une MariaDB, même vide — c'est ce que sert Hostinger, quoi qu'en
    # dise son panneau. Même version que docker-compose.yml : vérifier sur un
    # autre moteur que celui d'arrivée ne vérifierait rien.
    #
    # Une différence avec le développement, et elle est voulue : GitHub ne
    # permet pas de passer de commande à un service, donc pas de
    # `--default-time-zone=+00:00`. Le serveur reste sur `SYSTEM`, qui vaut le
    # temps universel sur les machines de GitHub — le même fuseau, obtenu
    # autrement.
    services:
      base:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: racine
          MARIADB_USER: kevin
          MARIADB_PASSWORD: kevin
          MARIADB_DATABASE: kevinmachy
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 127.0.0.1 et non localhost : celui-ci se résout parfois en IPv6, que le
      # service n'écoute pas.
      DATABASE_URI: mysql://kevin:kevin@127.0.0.1:3306/kevinmachy
      NEXT_PUBLIC_URL_SITE: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vérifie aussi que les migrations s'appliquent sur une base vierge :
      # une migration cassée se voit ici, pas le jour du déploiement.
      - name: Migrations
        run: npm run migrer

      - name: Types
        run: npx tsc --noEmit

      # Les images encodées sont versionnées dans public/img : rien à
      # régénérer ici. Relancer `npm run images` en local après toute
      # modification de scripts/build-images.mjs.
      - name: Construction
        run: npm run build
