# Build sur GitHub, envoi des fichiers sur Hostinger.
#
# Le site est un export statique : Hostinger n'a rien à exécuter, il sert des
# fichiers. La fonction « Advanced → Git » de hPanel ne lance aucune étape de
# build — c'est donc GitHub qui construit, et qui téléverse le résultat.
#
# Secrets à créer dans GitHub (Settings → Secrets → Actions) :
#   HOSTINGER_FTP_SERVER    ex. ftp.kevinmachy.fr
#   HOSTINGER_FTP_USERNAME
#   HOSTINGER_FTP_PASSWORD
# Les identifiants FTP se trouvent dans hPanel → Fichiers → Comptes FTP.

name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    # Le contexte `secrets` n'est pas autorisé dans un `if` d'étape : GitHub
    # rejette le fichier avant même de créer le job. On passe donc le secret
    # par l'environnement du job, que `if` sait lire.
    env:
      FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les images encodées sont versionnées dans public/img : rien à
      # régénérer ici. Relancer `npm run images` en local après toute
      # modification de scripts/build-images.mjs.
      - run: npm run build

      # Tant que les secrets FTP n'existent pas, l'envoi est sauté plutôt que
      # de faire échouer la CI : le build reste vérifié à chaque push, et le
      # déploiement s'active tout seul le jour où les secrets sont créés.
      - name: Envoi FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./public_html/
          # Ne transfère que les fichiers modifiés depuis le dernier envoi.
          state-name: .ftp-deploy-sync-state.json

      - name: Secrets FTP manquants
        if: env.FTP_SERVER == ''
        run: |
          echo "::notice title=Déploiement sauté::Le site a bien été construit, mais rien n'a été envoyé sur Hostinger."
          echo "Créer les trois secrets dans Settings → Secrets and variables → Actions :"
          echo "  HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME, HOSTINGER_FTP_PASSWORD"
          echo "Ils se trouvent dans hPanel → Fichiers → Comptes FTP." 
