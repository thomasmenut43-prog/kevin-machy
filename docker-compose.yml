# Base de données de développement.
#
# MariaDB, comme l'hébergement du client. Hostinger annonce « MySQL » et sert
# en réalité MariaDB : c'est vérifiable en s'y connectant, pas dans hPanel.
# Les deux moteurs parlent presque la même langue, et c'est ce « presque » qui
# est dangereux — répéter sur l'un pour jouer sur l'autre, c'est repousser les
# mauvaises surprises au jour de la mise en ligne (PRD § 12). Une seule
# commande suffit :
#
#   docker compose up -d
#
# Les données vivent dans un volume Docker : `docker compose down` arrête la
# base sans rien perdre, `docker compose down -v` efface tout.

services:
  base:
    image: mariadb:11.8
    container_name: kevin-machy-base
    restart: unless-stopped
    command:
      # Le fuseau du serveur est mis en temps universel, comme le pilote : une
      # date écrite ici et relue ailleurs doit désigner le même instant. Le
      # serveur de Hostinger est en UTC lui aussi, par son fuseau système.
      - --default-time-zone=+00:00
    environment:
      MARIADB_ROOT_PASSWORD: racine
      MARIADB_USER: kevin
      MARIADB_PASSWORD: kevin
      MARIADB_DATABASE: kevinmachy
    ports:
      - '3306:3306'
    volumes:
      - donnees:/var/lib/mysql
    healthcheck:
      # Script fourni par l'image : il attend qu'InnoDB soit vraiment prêt, là
      # où un simple ping répond déjà pendant l'initialisation.
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  # Boîte aux lettres de développement.
  #
  # Elle capte tout ce que le site envoie : on voit l'e-mail partir et son
  # rendu, sans qu'aucun message ne quitte la machine. Indispensable pour
  # mettre au point les réglages SMTP sans spammer personne.
  #
  #   SMTP     localhost:1025
  #   Lecture  http://localhost:8525
  #
  # Elle accepte n'importe quel identifiant : elle sert à voir, pas à filtrer.
  courrier:
    image: axllent/mailpit:latest
    container_name: kevin-machy-courrier
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      # 8525 côté machine, pas 8025 : Windows réserve la plage 7934-8433 pour
      # Hyper-V, et Docker ne peut pas y lier un port. Mailpit écoute bien sur
      # 8025 dans le conteneur.
      - '8525:8025'

volumes:
  donnees:
