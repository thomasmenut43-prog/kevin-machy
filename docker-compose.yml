# Base de données de développement.
#
# MySQL, comme l'hébergement du client : le mutualisé Hostinger ne propose que
# cela. Développer sur un autre moteur que celui d'arrivée, c'est repousser les
# mauvaises surprises au jour de la mise en ligne — le risque nommé au § 12 du
# PRD. Une seule commande suffit :
#
#   docker compose up -d
#
# Les données vivent dans un volume Docker : `docker compose down` arrête la
# base sans rien perdre, `docker compose down -v` efface tout.

services:
  base:
    image: mysql:8.4
    container_name: kevin-machy-base
    restart: unless-stopped
    command:
      # Le fuseau du serveur est mis en temps universel, comme le pilote : une
      # date écrite ici et relue ailleurs doit désigner le même instant.
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: racine
      MYSQL_USER: kevin
      MYSQL_PASSWORD: kevin
      MYSQL_DATABASE: kevinmachy
    ports:
      - '3306:3306'
    volumes:
      - donnees:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ukevin', '-pkevin']
      interval: 5s
      timeout: 5s
      retries: 20

  # Boîte aux lettres de développement.
  #
  # Elle capte tout ce que le site envoie : on voit l'e-mail partir et son
  # rendu, sans qu'aucun message ne quitte la machine. Indispensable pour
  # mettre au point les réglages SMTP sans spammer personne.
  #
  #   SMTP     localhost:1025
  #   Lecture  http://localhost:8525
  #
  # Elle accepte n'importe quel identifiant : elle sert à voir, pas à filtrer.
  courrier:
    image: axllent/mailpit:latest
    container_name: kevin-machy-courrier
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      # 8525 côté machine, pas 8025 : Windows réserve la plage 7934-8433 pour
      # Hyper-V, et Docker ne peut pas y lier un port. Mailpit écoute bien sur
      # 8025 dans le conteneur.
      - '8525:8025'

volumes:
  donnees:
